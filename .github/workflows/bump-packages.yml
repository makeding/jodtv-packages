name: Bump packages

on:
  schedule:
    # 03:23 Asia/Tokyo (18:23 UTC on the previous day).
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-packages
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      NIXPKGS_ALLOW_UNFREE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
            cores = 2

      - name: Cache Nix builds between runs
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ''

      - name: Check updater
        run: python3 -B -m unittest discover -s scripts -p 'test_bump_deps.py'

      - name: Update package sources and dependency hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell --inputs-from . nixpkgs#nix-update nixpkgs#python3 \
            --command python3 scripts/bump-deps.py --all --system x86_64-linux

      - name: Validate updated packages
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- . ':!pkgs'
          while IFS= read -r path; do
            case "$path" in
              pkgs/*/package.nix)
                package="${path#pkgs/}"
                package="${package%/package.nix}"
                nix eval --impure --raw ".#legacyPackages.x86_64-linux.${package}.drvPath" > /dev/null
                ;;
            esac
          done < <(git diff --name-only -- pkgs)

      - name: Commit and push updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- pkgs
          if git diff --cached --quiet; then
            echo 'All packages are up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: bump packaged dependencies'
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"

      - name: Show partial edits on failure
        if: failure()
        run: git diff HEAD -- pkgs
