name: Build packages

on:
  push:
    paths:
      - 'pkgs/**'
      - 'lib/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'overlay.nix'
      - 'scripts/build-common-deps.py'
      - 'scripts/test_build_common_deps.py'
      - 'scripts/gc-caches.py'
      - 'scripts/test_gc_caches.py'
      - '.github/workflows/build-packages.yml'
      - '.github/workflows/build-system.yml'
  # GITHUB_TOKEN pushes from the updater do not trigger push workflows.
  workflow_run:
    workflows: ['Bump packages', 'Bump nixpkgs']
    types: [completed]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages separated by spaces or commas; leave empty to build all'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NIXPKGS_ALLOW_UNFREE: '1'

jobs:
  revision:
    name: Pin build revision
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/build-system.yml
    with:
      system: ${{ matrix.system }}
      runner: ${{ matrix.runner }}
      revision: ${{ needs.revision.outputs.revision }}
      packages: ${{ inputs.packages || '' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  gc:
    name: Prune obsolete CI caches
    needs: [revision, build]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_dispatch' || inputs.packages == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.revision.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
            cores = 2

      # Source-dependent evaluation may need outputs built on the other architecture.
      - name: Read the jodtv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jodtv
          skipPush: true

      - name: Check cache retention
        run: python3 -B -m unittest discover -s scripts -p test_gc_caches.py

      - name: Prune caches after the complete build and uploads succeeded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHIX_GC_AUTH_TOKEN: ${{ secrets.CACHIX_GC_AUTH_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILT_REVISION: ${{ needs.revision.outputs.revision }}
        run: |
          if [ -z "$CACHIX_GC_AUTH_TOKEN" ]; then
            echo '::error::Add CACHIX_GC_AUTH_TOKEN as a Cachix personal API token from https://app.cachix.org/personal-auth-tokens; the per-cache read/write token is not sufficient.'
            exit 1
          fi
          python3 -B scripts/gc-caches.py --apply \
            --branch "$DEFAULT_BRANCH" --revision "$BUILT_REVISION" \
            --system x86_64-linux --system aarch64-linux
