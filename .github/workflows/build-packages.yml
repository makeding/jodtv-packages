name: Build packages

on:
  push:
    paths:
      - 'pkgs/**'
      - 'lib/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'overlay.nix'
      - '.github/workflows/build-packages.yml'
  # GITHUB_TOKEN pushes from the updater do not trigger push workflows.
  workflow_run:
    workflows: ['Bump packages']
    types: [completed]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages separated by spaces or commas; leave empty to build all'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NIXPKGS_ALLOW_UNFREE: '1'

jobs:
  prepare:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      revision: ${{ steps.packages.outputs.revision }}
    steps:
      - name: Check Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo '::error::Add the repository Actions secret CACHIX_AUTH_TOKEN with write access to the jodtv cache.'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The updater's original head SHA predates its new bump commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select packages and pin the build revision
        id: packages
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          export AVAILABLE_PACKAGES
          AVAILABLE_PACKAGES="$(nix eval --json --apply builtins.attrNames .#packages.x86_64-linux)"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          available = json.loads(os.environ['AVAILABLE_PACKAGES'])
          requested = list(dict.fromkeys(os.environ['REQUESTED_PACKAGES'].replace(',', ' ').split()))
          unknown = sorted(set(requested) - set(available))
          if unknown:
              raise SystemExit('Unknown packages: ' + ', '.join(unknown))
          print('packages=' + json.dumps(requested or available))
          PY
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }} (x86_64-linux)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
            cores = 2

      - name: Read and populate the jodtv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jodtv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build --impure --no-link --print-build-logs ".#packages.x86_64-linux.${PACKAGE}"
