name: Bump nixpkgs

on:
  schedule:
    # Sunday 03:53 Asia/Tokyo (Saturday 18:53 UTC).
    - cron: '53 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize default-branch writes with the daily package updater.
  group: bump-packages
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      NIXPKGS_ALLOW_UNFREE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
            cores = 2

      - name: Update nixpkgs
        run: nix flake update nixpkgs

      - name: Validate updated package derivations
        run: |
          git diff --check
          git diff --exit-code -- . ':!flake.lock'
          nix eval --impure --json .#packages.x86_64-linux \
            --apply 'packages: builtins.mapAttrs (_: package: package.drvPath) packages' > /dev/null

      - name: Commit and push update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- flake.lock
          if git diff --cached --quiet; then
            echo 'nixpkgs is up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: bump nixpkgs'
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"

      - name: Show partial edits on failure
        if: failure()
        run: git diff HEAD -- flake.lock
