name: Build native system

on:
  workflow_call:
    inputs:
      system:
        required: true
        type: string
      runner:
        required: true
        type: string
      revision:
        required: true
        type: string
      packages:
        default: ''
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_UNFREE: '1'

jobs:
  prepare:
    name: Build and cache common dependencies
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      revision: ${{ steps.packages.outputs.revision }}
    steps:
      - name: Check Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo '::error::Add the repository Actions secret CACHIX_AUTH_TOKEN with write access to the jodtv cache.'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The updater's original head SHA predates its new bump commit.
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2

      - name: Read and populate the jodtv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jodtv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check dependency planning
        run: python3 -B -m unittest discover -s scripts -p test_build_common_deps.py

      - name: Build common dependencies and pin the build revision
        id: packages
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          python3 -B scripts/build-common-deps.py --build --system "${{ inputs.system }}" --packages "$REQUESTED_PACKAGES" --filter-supported
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }} (${{ inputs.system }})
    # needs includes the prepare job's post steps, so Cachix has flushed uploads.
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
            cores = 2

      - name: Read and populate the jodtv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jodtv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build --impure --no-link --print-build-logs ".#packages.${{ inputs.system }}.${PACKAGE}"

